<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">A learner's study corner</title><desc id="desc">A warm, modern illustration of a student learning at a desk with a laptop, open book, notebook, plant and floating study symbols.</desc>
<defs>
