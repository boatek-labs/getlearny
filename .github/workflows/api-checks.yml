name: GetLearny API checks

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['api/**', 'web/**', 'package.json', 'vercel.json', '.github/workflows/api-checks.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api-checks.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Check Vercel function and browser JavaScript syntax
        run: |
          node --check '[...path].js'
          node --check ../web/app.js
          node --check ../web/sw.js
          node -e "JSON.parse(require('node:fs').readFileSync('../vercel.json', 'utf8'))"
