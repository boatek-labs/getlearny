name: Build GetLearny Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files without replacing app source
        run: |
          flutter create --platforms=android --org com.boateklabs --project-name getlearny /tmp/getlearny-android-scaffold
          cp -R /tmp/getlearny-android-scaffold/android app/android

      - name: Enable Android notification scheduling support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          groovy = Path('app/android/app/build.gradle')
          kotlin = Path('app/android/app/build.gradle.kts')
          path = kotlin if kotlin.exists() else groovy
          if not path.exists():
              raise SystemExit('Generated Android app Gradle file was not found')
          text = path.read_text()
          if path.suffix == '.kts':
              if 'isCoreLibraryDesugaringEnabled = true' not in text:
                  text = text.replace('compileOptions {', 'compileOptions {\\n        isCoreLibraryDesugaringEnabled = true', 1)
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in text:
                  text = text.replace('dependencies {', 'dependencies {\\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
          else:
              if 'coreLibraryDesugaringEnabled true' not in text:
                  text = text.replace('compileOptions {', 'compileOptions {\\n        coreLibraryDesugaringEnabled true', 1)
              if 'coreLibraryDesugaring ' not in text:
                  text = text.replace('dependencies {', "dependencies {\\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'", 1)
          path.write_text(text)
          PY

      - name: Resolve packages
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: app
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        working-directory: app
        run: flutter test --no-pub

      - name: Build debug APK
        working-directory: app
        env:
          GETLEARNY_API_URL: ${{ vars.GETLEARNY_API_URL }}
        run: |
          GETLEARNY_API_URL="${GETLEARNY_API_URL:-https://getlearny.vercel.app/api/v1}"
          flutter build apk --debug --dart-define=GETLEARNY_API_URL="$GETLEARNY_API_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: getlearny-android-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
