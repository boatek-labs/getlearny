name: Build GetLearny Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files without replacing app source
        run: |
          flutter create --platforms=android --org com.boateklabs --project-name getlearny /tmp/getlearny-android-scaffold
          cp -R /tmp/getlearny-android-scaffold/android app/android

      - name: Configure Android notification permissions and reboot receiver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          boot_permission = '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              text = text.replace('<application', permission + '\n' + boot_permission + '\n    <application', 1)
          receivers = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>'''
          if 'ScheduledNotificationBootReceiver' not in text:
              text = text.replace('</application>', receivers + '\n    </application>', 1)
          path.write_text(text)
          PY

      - name: Enable Android notification scheduling support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          groovy = Path('app/android/app/build.gradle')
          kotlin = Path('app/android/app/build.gradle.kts')
          path = kotlin if kotlin.exists() else groovy
          if not path.exists():
              raise SystemExit('Generated Android app Gradle file was not found')
          text = path.read_text()
          if path.suffix == '.kts':
              if 'isCoreLibraryDesugaringEnabled = true' not in text:
                  text, count = re.subn(r'(compileOptions\\s*\\{)', r'\\1\\n        isCoreLibraryDesugaringEnabled = true', text, count=1)
                  if count == 0:
                      raise SystemExit('Could not find compileOptions block in Kotlin Gradle file')
              if not any('coreLibraryDesugaring(' in line for line in text.splitlines()):
                  text, count = re.subn(r'(dependencies\\s*\\{)', r'\\1\\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', text, count=1)
                  if count == 0:
                      text += '\\ndependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }\\n'
              if not any('coreLibraryDesugaring(' in line for line in text.splitlines()):
                  raise SystemExit('Core library desugaring dependency was not added')
          else:
              if 'coreLibraryDesugaringEnabled true' not in text:
                  text, count = re.subn(r'(compileOptions\\s*\\{)', r'\\1\\n        coreLibraryDesugaringEnabled true', text, count=1)
                  if count == 0:
                      raise SystemExit('Could not find compileOptions block in Groovy Gradle file')
              if not any(line.strip().startswith('coreLibraryDesugaring ') for line in text.splitlines()):
                  text, count = re.subn(r'(dependencies\\s*\\{)', r"\\1\\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'", text, count=1)
                  if count == 0:
                      text += "\\ndependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4' }\\n"
              if not any(line.strip().startswith('coreLibraryDesugaring ') for line in text.splitlines()):
                  raise SystemExit('Core library desugaring dependency was not added')
          path.write_text(text)
          print('Configured core library desugaring in', path)
          print('Dependency configured:', any('coreLibraryDesugaring' in line and 'desugar_jdk_libs' in line for line in text.splitlines()))
          PY

      - name: Resolve packages
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: app
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        working-directory: app
        run: flutter test --no-pub

      - name: Build debug APK
        working-directory: app
        env:
          GETLEARNY_API_URL: ${{ vars.GETLEARNY_API_URL }}
        run: |
          GETLEARNY_API_URL="${GETLEARNY_API_URL:-https://getlearny.vercel.app/api/v1}"
          flutter build apk --debug --dart-define=GETLEARNY_API_URL="$GETLEARNY_API_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: getlearny-android-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
