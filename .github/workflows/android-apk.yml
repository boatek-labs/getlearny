name: Build GetLearny Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files without replacing app source
        run: |
          flutter create --platforms=android --org com.boateklabs --project-name getlearny /tmp/getlearny-android-scaffold
          cp -R /tmp/getlearny-android-scaffold/android app/android

      - name: Configure Android notification permissions and reboot receiver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          boot_permission = '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              text = text.replace('<application', permission + '\n' + boot_permission + '\n    <application', 1)
          # Replace the generated Flutter launcher icon with the GetLearny brand mark.
          drawable = Path('app/android/app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)
          launcher = drawable / 'getlearny_launcher.xml'
          launcher.write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FF11152B" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#FFF7F8FF" android:pathData="M18,28c10,-5 21,-4 36,3v43c-15,-7 -26,-8 -36,-3z"/><path android:fillColor="#FFC7BCFF" android:pathData="M90,28c-10,-5 -21,-4 -36,3v43c15,-7 26,-8 36,-3z"/><path android:strokeColor="#FF11152B" android:strokeWidth="3" android:strokeLineCap="round" android:pathData="M54,32v42"/><path android:fillColor="#FF91E8FF" android:pathData="M77,12l4,9 9,4 -9,4 -4,9 -4,-9 -9,-4 9,-4z"/></vector>''')
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/getlearny_launcher"')
          path.write_text(text)
          receivers = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>'''
          if 'ScheduledNotificationBootReceiver' not in text:
              text = text.replace('</application>', receivers + '\n    </application>', 1)
          path.write_text(text)
          drawable = Path('app/android/app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)
          icon = drawable / 'ic_notification.xml'
          icon.write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M3,5.5 C6,4.2 9,4.6 12,6.4 L12,20 C9,18.2 6,17.8 3,19.1 Z"/><path android:fillColor="#FFFFFFFF" android:pathData="M21,5.5 C18,4.2 15,4.6 12,6.4 L12,20 C15,18.2 18,17.8 21,19.1 Z"/><path android:fillColor="#FFFFFFFF" android:pathData="M16,2 L17,4.5 L19.5,5.5 L17,6.5 L16,9 L15,6.5 L12.5,5.5 L15,4.5 Z"/></vector>''')
          print('Created violet-brand-compatible Android notification glyph:', icon)
          PY

      - name: Enable Android notification scheduling support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          nl = chr(10)
          groovy = Path('app/android/app/build.gradle')
          kotlin = Path('app/android/app/build.gradle.kts')
          path = kotlin if kotlin.exists() else groovy
          if not path.exists():
              raise SystemExit('Generated Android app Gradle file was not found')
          text = path.read_text()
          if path.suffix == '.kts':
              if 'isCoreLibraryDesugaringEnabled = true' not in text:
                  if 'compileOptions {' not in text:
                      raise SystemExit('Could not find compileOptions block in Kotlin Gradle file')
                  text = text.replace('compileOptions {', 'compileOptions {' + nl + '        isCoreLibraryDesugaringEnabled = true', 1)
              if not any('coreLibraryDesugaring(' in line and 'desugar_jdk_libs' in line for line in text.splitlines()):
                  dep = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                  if 'dependencies {' in text:
                      text = text.replace('dependencies {', 'dependencies {' + nl + dep, 1)
                  else:
                      text += nl + 'dependencies {' + nl + dep + nl + '}' + nl
          else:
              if 'coreLibraryDesugaringEnabled true' not in text:
                  if 'compileOptions {' not in text:
                      raise SystemExit('Could not find compileOptions block in Groovy Gradle file')
                  text = text.replace('compileOptions {', 'compileOptions {' + nl + '        coreLibraryDesugaringEnabled true', 1)
              if not any(line.strip().startswith('coreLibraryDesugaring ') and 'desugar_jdk_libs' in line for line in text.splitlines()):
                  dep = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
                  if 'dependencies {' in text:
                      text = text.replace('dependencies {', 'dependencies {' + nl + dep, 1)
                  else:
                      text += nl + 'dependencies {' + nl + dep + nl + '}' + nl
          if not any('coreLibraryDesugaring' in line and 'desugar_jdk_libs' in line for line in text.splitlines()):
              raise SystemExit('Core library desugaring dependency was not added')
          path.write_text(text)
          print('Configured core library desugaring in', path)
          PY


      - name: Set Android compile SDK required by file picker plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/android/app/build.gradle.kts')
          if not path.exists():
              path = Path('app/android/app/build.gradle')
          text = path.read_text()
          if path.suffix == '.kts':
              import re
              text, count = re.subn(r'(?m)^\s*compileSdk\s*=\s*[^\n]+', '    compileSdk = 36', text, count=1)
              if count == 0:
                  text, count = re.subn(r'(?m)^\s*compileSdk\s+[^\n]+', '    compileSdk 36', text, count=1)
          else:
              import re
              text, count = re.subn(r'compileSdk\s+\d+', 'compileSdk 36', text, count=1)
          if count == 0:
              raise SystemExit('Could not locate compileSdk declaration')
          path.write_text(text)
          print('Set compileSdk to 36 in', path)
          PY

      - name: Resolve packages
        working-directory: app
        run: flutter pub get


      - name: Align Android plugin compile SDK versions
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          changed = []
          for path in root.glob('*/android/build.gradle*'):
              try:
                  text = path.read_text()
              except (OSError, UnicodeDecodeError):
                  continue
              if path.suffix == '.kts':
                  updated, count = re.subn(r'(?m)^([ \t]*)compileSdk[ \t]*=[ \t]*(?:flutter[.]compileSdkVersion|[0-9]+)', r'\g<1>compileSdk = 36', text)
              else:
                  updated, count = re.subn(r'(?m)^([ \t]*)(?:compileSdkVersion|compileSdk)[ \t]*(?:=[ \t]*)?(?:flutter[.]compileSdkVersion|[0-9]+)', r'\g<1>compileSdkVersion 36', text)
              if count and updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          print('Raised compile SDK to 36 in', len(changed), 'cached Android plugin Gradle file(s)')
          for path in changed:
              print(' -', path)
          PY

      - name: Analyze Flutter source
        working-directory: app
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        working-directory: app
        run: flutter test --no-pub

      - name: Build APK
        working-directory: app
        env:
          GETLEARNY_API_URL: ${{ vars.GETLEARNY_API_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          GETLEARNY_API_URL="${GETLEARNY_API_URL:-https://getlearny.vercel.app/api/v1}"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/getlearny-release.jks
            flutter build apk --release --dart-define=GETLEARNY_API_URL="$GETLEARNY_API_URL"
            APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' ! -name '*unsigned*' | head -n 1)"
            if [ -z "$APK" ]; then APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' | head -n 1)"; fi
            test -n "$APK"
            zipalign -f -p 4 "$APK" build/app/outputs/flutter-apk/getlearny-aligned.apk
            apksigner sign --ks android/app/getlearny-release.jks --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --out build/app/outputs/flutter-apk/getlearny.apk build/app/outputs/flutter-apk/getlearny-aligned.apk
            apksigner verify build/app/outputs/flutter-apk/getlearny.apk
            rm -f android/app/getlearny-release.jks build/app/outputs/flutter-apk/getlearny-aligned.apk
            echo "Built APK with the persistent release signing key."
          else
            flutter build apk --debug --dart-define=GETLEARNY_API_URL="$GETLEARNY_API_URL"
            cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/getlearny.apk
            echo "::warning::Built a debug-signed APK. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD as GitHub Actions secrets for consistent signatures across updates."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: getlearny-android-apk
          path: app/build/app/outputs/flutter-apk/getlearny.apk
          if-no-files-found: error
          retention-days: 30
