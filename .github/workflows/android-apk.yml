name: Build GetLearny Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files without replacing app source
        run: |
          flutter create --platforms=android --org com.boateklabs --project-name getlearny /tmp/getlearny-android-scaffold
          cp -R /tmp/getlearny-android-scaffold/android app/android

      - name: Resolve packages
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: app
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        working-directory: app
        run: flutter test --no-pub

      - name: Build debug APK
        working-directory: app
        env:
          GETLEARNY_API_URL: ${{ vars.GETLEARNY_API_URL }}
        run: |
          if [ -n "$GETLEARNY_API_URL" ]; then
            flutter build apk --debug --dart-define=GETLEARNY_API_URL="$GETLEARNY_API_URL"
          else
            flutter build apk --debug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: getlearny-android-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
